<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Zoe Morales Ervolino</title>
    <style>
        @font-face {
            font-family: 'NakedChicks';
            src: url('fonts/NakedChicks.ttf') format('truetype');
        }
        @font-face {
            font-family: 'OpenDyslexic';
            src: url('fonts/OpenDyslexic-Regular.otf') format('opentype');
        }
        body {
            font-family: 'OpenDyslexic', sans-serif;
            background-color: lavender;
            margin: 0;
            display: flex;
            justify-content: flex-start; /* Align content to the left */
            align-items: center; /* Center content vertically */
            height: 100vh;
            overflow: hidden;
            position: relative;
            padding-left: 20px; /* Add padding to the left */
        }
        .text-container {
            max-width: 33%; /* Wrap text after 1/3rd of the screen */
            text-align: left;
        }
        h1 {
            font-family: 'NakedChicks', sans-serif;
            font-size: 40px;
            opacity: 0;
            animation: fadeIn 3s forwards;
        }
        p {
            font-size: 16px;
            opacity: 0;
            animation: fadeIn 3s forwards;
            animation-delay: 1s;
        }
        .menu {
            margin-top: 20px;
        }
        .menu a {
            font-size: 16px;
            font-style: italic;
            color: midnightblue;
            text-decoration: none;
            margin-right: 15px;
        }
        .menu a:hover {
            text-decoration: underline;
        }
        img {
            width: 60%;
            height: auto;
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
</head>
